<script>
  document.querySelector('form').addEventListener('submit', function(e) {
    var input = document.getElementById('email');
    var emptyError = document.getElementById('emailErrorEmpty');
    var notFoundError = document.getElementById('emailErrorNotFound');
    var value = input.value.trim();

    emptyError.style.display = 'none';
    notFoundError.style.display = 'none';

    // Проверка 1: пусто
    if (value === '') {
      e.preventDefault();
      emptyError.style.display = 'flex';
      input.style.borderColor = '#efb9b7';
      input.style.borderWidth = '2px';
      return;
    }

    // Проверка 2: должен заканчиваться на @gmail.com
    if (!value.toLowerCase().endsWith('@gmail.com')) {
      e.preventDefault();
      notFoundError.style.display = 'flex';
      input.style.borderColor = '#efb9b7';
      input.style.borderWidth = '2px';
      return;
    }

    // Проверка 3: перед @gmail.com должно быть что-то (не пусто)
    if (value.toLowerCase() === '@gmail.com') {
      e.preventDefault();
      emptyError.style.display = 'flex';
      input.style.borderColor = '#efb9b7';
      input.style.borderWidth = '2px';
      return;
    }

    // Всё ок — форма отправится на /password
  });

  document.getElementById('email').addEventListener('input', function() {
    document.getElementById('emailErrorEmpty').style.display = 'none';
    document.getElementById('emailErrorNotFound').style.display = 'none';
    this.style.borderColor = '';
    this.style.borderWidth = '';
  });
</script>
